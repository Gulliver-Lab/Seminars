name: Publish seminar calendar

on:
  repository_dispatch:
    types: [publish-calendar]

permissions:
  contents: read

concurrency:
  group: seminar-calendar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare calendar feed
        env:
          ICS_BASE64: ${{ github.event.client_payload.ics_base64 }}
        run: |
          set -euo pipefail
          test -n "$ICS_BASE64"
          mkdir site
          printf '%s' "$ICS_BASE64" | base64 --decode > site/calendar.ics
          test -s site/calendar.ics

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
