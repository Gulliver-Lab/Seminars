name: Publish seminar calendar

on:
  repository_dispatch:
    types: [publish-calendar]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare calendar feed
        env:
          ICS_BASE64: ${{ github.event.client_payload.ics_base64 }}
        run: |
          set -euo pipefail
          test -n "$ICS_BASE64"
          mkdir site
          printf '%s' "$ICS_BASE64" | base64 --decode > site/calendar.ics
          test -s site/calendar.ics

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
